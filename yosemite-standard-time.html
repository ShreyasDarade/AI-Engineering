<title>Yosemite Standard Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F1EFE9; --surface:#FBFAF7; --surface-2:#E7E3DA; --sunk:#DFDACF;
  --line:#D3CDC1; --line-soft:#E3DED4;
  --ink:#191C20; --ink-2:#4B5058; --ink-3:#7A808A;
  --accent:#B94E1C; --accent-ink:#B94E1C; --accent-soft:#F4E0D3; --on-accent:#FFFFFF;
  --cool:#2A657F; --cool-soft:#DBE7ED;
  --ok:#3B7549; --ok-soft:#DCE9DE;
  --warn:#9E7015; --warn-soft:#F3E7CC;
  --bad:#A63929; --bad-soft:#F3DBD6;
  --shadow:0 1px 2px rgba(25,28,32,.06), 0 4px 14px rgba(25,28,32,.05);
  --r:12px; --r-sm:8px;
  --f-display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body:'Source Sans 3', system-ui, -apple-system, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111419; --surface:#191D23; --surface-2:#222730; --sunk:#0C0F13;
    --line:#2D333C; --line-soft:#242A32;
    --ink:#ECE8E1; --ink-2:#A5ABB5; --ink-3:#737A85;
    --accent:#E8834E; --accent-ink:#F0996A; --accent-soft:#3A2116; --on-accent:#171208;
    --cool:#6DA9C7; --cool-soft:#162A35;
    --ok:#63A876; --ok-soft:#16281B;
    --warn:#D5A73E; --warn-soft:#2C2413;
    --bad:#D96D5C; --bad-soft:#301813;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#111419; --surface:#191D23; --surface-2:#222730; --sunk:#0C0F13;
  --line:#2D333C; --line-soft:#242A32;
  --ink:#ECE8E1; --ink-2:#A5ABB5; --ink-3:#737A85;
  --accent:#E8834E; --accent-ink:#F0996A; --accent-soft:#3A2116; --on-accent:#171208;
  --cool:#6DA9C7; --cool-soft:#162A35;
  --ok:#63A876; --ok-soft:#16281B;
  --warn:#D5A73E; --warn-soft:#2C2413;
  --bad:#D96D5C; --bad-soft:#301813;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}

/* ============ BASE ============ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
.wrap{max-width:600px; margin:0 auto; padding:0 0 96px}
h1,h2,h3,h4{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-.015em}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
a{color:var(--accent-ink); text-decoration-thickness:1px; text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} }

/* ============ HEADER ============ */
header.top{
  position:sticky; top:0; z-index:60; background:var(--bg);
  border-bottom:1px solid var(--line);
}
.brandrow{display:flex; align-items:center; gap:10px; padding:12px 14px 8px}
.mark{
  width:34px; height:34px; flex:none; border-radius:8px; background:var(--ink);
  display:grid; place-items:center;
}
.mark svg{display:block}
.brand{min-width:0}
.brand h1{font-size:17px; font-weight:800; line-height:1.1; letter-spacing:-.02em}
.brand .sub{
  font-family:var(--f-mono); font-size:10px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-3); margin-top:3px; white-space:nowrap;
}
.clockbox{margin-left:auto; text-align:right; flex:none; padding-left:4px}
.clockbox .t{font-family:var(--f-mono); font-size:17px; font-weight:600; line-height:1}
.clockbox .d{font-family:var(--f-mono); font-size:10px; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase; margin-top:3px}

/* tab rail */
nav.rail{display:flex; gap:2px; overflow-x:auto; padding:0 10px 0; scrollbar-width:none; -webkit-overflow-scrolling:touch}
nav.rail::-webkit-scrollbar{display:none}
nav.rail button{
  flex:none; padding:9px 11px 10px; font-family:var(--f-display); font-size:12px;
  font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3);
  border-bottom:2.5px solid transparent; white-space:nowrap;
}
nav.rail button[aria-selected="true"]{color:var(--accent-ink); border-bottom-color:var(--accent)}
nav.rail button:hover{color:var(--ink-2)}
nav.rail button[aria-selected="true"]:hover{color:var(--accent-ink)}

/* ============ SECTIONS / CARDS ============ */
section[role="tabpanel"]{padding:14px 16px 0; display:flex; flex-direction:column; gap:14px}
.card{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.card-pad{padding:14px}
.card-head{display:flex; align-items:baseline; gap:8px; padding:13px 14px 0}
.card-head h2{font-size:15px; font-weight:700}
.card-head h3{font-size:14px; font-weight:700}
.eyebrow{
  font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3);
}
.eyebrow.pin{margin-left:auto; text-align:right; max-width:46%; line-height:1.35}
.card-head{flex-wrap:wrap}
.hint{font-size:13.5px; color:var(--ink-2); line-height:1.45}
.hint.sm{font-size:12.5px}
.divider{height:1px; background:var(--line-soft); margin:0}

/* pills */
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px;
  font-family:var(--f-mono); font-size:10.5px; font-weight:500; letter-spacing:.05em;
  text-transform:uppercase; white-space:nowrap;
}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.cool{background:var(--cool-soft); color:var(--cool)}
.pill.accent{background:var(--accent-soft); color:var(--accent-ink)}
.pill.plain{background:var(--surface-2); color:var(--ink-2)}

/* ============ HERO / NOW ============ */
.hero{
  background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden;
}
.hero-top{padding:14px 14px 12px; display:flex; flex-direction:column; gap:3px}
.hero-label{display:flex; align-items:center; gap:7px}
.hero .what{font-family:var(--f-display); font-size:22px; font-weight:800; line-height:1.15}
.hero .where{font-size:13.5px; color:var(--ink-2)}
.countdown{
  display:flex; align-items:baseline; gap:9px; padding:11px 14px;
  background:var(--sunk); border-top:1px solid var(--line-soft);
}
.countdown .big{font-family:var(--f-mono); font-size:26px; font-weight:600; line-height:1; letter-spacing:-.02em}
.countdown .lbl{font-size:12.5px; color:var(--ink-2); line-height:1.3}
.countdown.urgent .big{color:var(--accent-ink)}

/* sun strip */
.sunstrip{display:flex; gap:0; border-top:1px solid var(--line-soft)}
.sunstrip div{flex:1; padding:9px 6px; text-align:center; border-right:1px solid var(--line-soft)}
.sunstrip div:last-child{border-right:none}
.sunstrip .k{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.sunstrip .v{font-family:var(--f-mono); font-size:13.5px; font-weight:600; margin-top:3px; white-space:nowrap}

/* ============ DAY RIBBON (signature) ============ */
.ribbon-wrap{padding:12px 14px 14px}
.ribbon{position:relative; width:100%; height:64px; border-radius:var(--r-sm); overflow:hidden; background:var(--sunk)}
.ribbon svg{display:block; width:100%; height:100%}
.ribbon-legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:9px}
.lg{display:flex; align-items:center; gap:5px; font-family:var(--f-mono); font-size:10px; color:var(--ink-3); letter-spacing:.04em; text-transform:uppercase}
.lg i{width:11px; height:11px; border-radius:3px; display:block; flex:none}

/* ============ TIMELINE ROWS ============ */
.tl{display:flex; flex-direction:column}
.tl-row{display:grid; grid-template-columns:58px 1fr; gap:10px; padding:9px 14px; border-top:1px solid var(--line-soft); align-items:start}
.tl-row:first-child{border-top:none}
.tl-row.drive{background:var(--sunk)}
.tl-time{font-family:var(--f-mono); font-size:13px; font-weight:600; padding-top:1px; letter-spacing:-.02em}
.tl-time small{display:block; font-size:9.5px; font-weight:400; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase; margin-top:1px}
.tl-body{min-width:0; display:flex; flex-direction:column; gap:3px}
.tl-title{font-family:var(--f-display); font-size:14.5px; font-weight:700; line-height:1.25; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.tl-note{font-size:12.5px; color:var(--ink-2); line-height:1.4}
.tl-note strong{color:var(--ink); font-weight:600}
.tl-row.drive .tl-title{font-family:var(--f-mono); font-size:12px; font-weight:500; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-2)}
.tl-row.now{background:var(--accent-soft)}
.tl-row.now .tl-time{color:var(--accent-ink)}
.tl-links{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:7px 11px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--surface-2); font-family:var(--f-display); font-size:12.5px; font-weight:600;
  color:var(--ink); white-space:nowrap; transition:background .12s ease, border-color .12s ease;
}
.btn:hover{background:var(--line-soft); border-color:var(--ink-3)}
.btn.go{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.go:hover{filter:brightness(1.08); background:var(--accent)}
.btn.sm{padding:4px 8px; font-size:11.5px}
.btn.ghost{background:transparent}
.btn.wide{width:100%; white-space:normal}
.btn.wide .vsum{white-space:normal; display:block}
.btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btnrow{display:flex; gap:8px; flex-wrap:wrap}

/* segmented */
.seg{display:flex; background:var(--sunk); border:1px solid var(--line-soft); border-radius:var(--r-sm); padding:3px; gap:3px}
.seg button{
  flex:1; padding:7px 6px; border-radius:6px; font-family:var(--f-display); font-size:12px;
  font-weight:700; color:var(--ink-2); letter-spacing:.02em; line-height:1.2;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

/* ============ LIST / CHECK ============ */
.rows{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line-soft)}
.row:first-child{border-top:none}
.row .grow{flex:1; min-width:0}
.row .nm{font-size:14px; font-weight:600; line-height:1.25}
.row .mt{font-size:12px; color:var(--ink-3); margin-top:1px}
.chk{
  width:22px; height:22px; flex:none; border-radius:6px; border:1.5px solid var(--line);
  background:var(--surface-2); display:grid; place-items:center; transition:all .12s ease;
}
.chk[aria-pressed="true"]{background:var(--ok); border-color:var(--ok)}
.chk svg{opacity:0; width:13px; height:13px}
.chk[aria-pressed="true"] svg{opacity:1}
.row.done .nm{text-decoration:line-through; color:var(--ink-3)}

/* avatars */
.who{display:flex; flex-wrap:wrap; gap:4px}
.av{
  width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--f-display); font-size:10.5px; font-weight:700; color:#FFFFFF; flex:none;
  border:1.5px solid var(--surface);
}
.av.lg{width:34px; height:34px; font-size:13px}
.av.off{opacity:.28}
.avbtn{border-radius:50%; padding:0; background:none; border:none}

/* ============ FORMS ============ */
input[type="text"], textarea, select{
  width:100%; padding:9px 11px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-family:var(--f-body); font-size:15px;
}
textarea{resize:vertical; min-height:64px; line-height:1.45}
input::placeholder, textarea::placeholder{color:var(--ink-3)}

/* ============ CROWD METER ============ */
.crowd{display:flex; flex-direction:column}
.crowd-row{padding:11px 14px; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:6px}
.crowd-row:first-child{border-top:none}
.crowd-top{display:flex; align-items:center; gap:8px}
.crowd-top .nm{font-family:var(--f-display); font-size:14px; font-weight:700; flex:1; min-width:0}
.bars{display:flex; gap:1.5px; height:26px; align-items:flex-end}
.bars i{flex:1; border-radius:2px 2px 0 0; display:block; min-height:3px; background:var(--line); position:relative}
.bars i.l1{background:var(--ok); height:28%}
.bars i.l2{background:var(--warn); height:55%}
.bars i.l3{background:var(--bad); height:82%}
.bars i.l4{background:var(--bad); height:100%; filter:saturate(1.4)}
.bars i.nowbar{outline:2px solid var(--ink); outline-offset:1px; z-index:2}
.hours{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:9px; color:var(--ink-3); letter-spacing:.04em}

/* ============ MAP ============ */
.mapbox{background:var(--sunk); border-radius:var(--r-sm); overflow:hidden; margin:0 14px 14px}
.mapbox svg{display:block; width:100%; height:auto}
.legendgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:7px; padding:0 14px 14px}
.legendgrid .li{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
.legendgrid .li i{width:9px; height:9px; border-radius:50%; flex:none; display:block}

/* ============ OFFLINE CARD ============ */
.offcard{background:var(--surface); border:1.5px solid var(--ink); border-radius:var(--r); overflow:hidden}
.offcard h2{
  font-size:12px; font-weight:800; letter-spacing:.11em; text-transform:uppercase;
  padding:9px 14px; background:var(--ink); color:var(--bg); display:flex; align-items:center; gap:7px;
}
.offgrid{display:flex; flex-direction:column}
.offrow{display:grid; grid-template-columns:82px 1fr; gap:9px; padding:8px 14px; border-top:1px solid var(--line-soft); font-size:13px; align-items:baseline}
.offrow:first-child{border-top:none}
.offrow .k{font-family:var(--f-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.offrow .v{line-height:1.4}
.offrow .v strong{font-weight:600}

/* ============ LOG / MEMORIES ============ */
.entry{padding:12px 14px; border-top:1px solid var(--line-soft); display:flex; gap:10px}
.entry:first-child{border-top:none}
.entry .ebody{flex:1; min-width:0}
.entry .emeta{display:flex; align-items:baseline; gap:7px; margin-bottom:3px}
.entry .ewho{font-family:var(--f-display); font-size:13px; font-weight:700}
.entry .ewhen{font-family:var(--f-mono); font-size:10px; color:var(--ink-3); letter-spacing:.05em}
.entry .etext{font-size:14px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere}
.quote{
  padding:16px 14px; font-family:var(--f-display); font-size:17px; font-weight:600;
  line-height:1.4; font-style:italic; color:var(--ink); border-left:3px solid var(--accent);
  background:var(--accent-soft); margin:0 14px 14px; border-radius:0 var(--r-sm) var(--r-sm) 0;
}
.quote cite{display:block; font-family:var(--f-body); font-style:normal; font-size:12.5px; font-weight:400; color:var(--ink-2); margin-top:7px}

/* stars */
.stars{display:flex; gap:2px}
.star{width:20px; height:20px; padding:0; color:var(--line)}
.star.on{color:var(--warn)}

/* ============ SYNC BANNER ============ */
.sync{
  display:flex; align-items:center; gap:8px; padding:8px 14px; font-size:12.5px;
  border-radius:var(--r-sm); background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--line-soft);
}
.sync .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex:none}
.sync.live .dot{background:var(--ok)}
.sync.local .dot{background:var(--warn)}

/* ============ FLAG / CALLOUT ============ */
.flag{display:flex; gap:9px; padding:11px 12px; border-radius:var(--r-sm); font-size:13px; line-height:1.45}
.flag .ic{flex:none; font-family:var(--f-display); font-weight:800; font-size:13px; line-height:1.3}
.flag.warn{background:var(--warn-soft); color:var(--ink)}
.flag.bad{background:var(--bad-soft); color:var(--ink)}
.flag.cool{background:var(--cool-soft); color:var(--ink)}
.flag.ok{background:var(--ok-soft); color:var(--ink)}
.flag strong{font-weight:700}

/* verdict bar */
.verdict{display:flex; align-items:center; gap:9px; padding:11px 14px; border-top:1px solid var(--line-soft)}
.verdict .vt{font-family:var(--f-display); font-size:13.5px; font-weight:700; flex:1; line-height:1.3}
.verdict .vn{font-family:var(--f-mono); font-size:15px; font-weight:600}

/* misc */
.stack{display:flex; flex-direction:column; gap:14px}
.tight{display:flex; flex-direction:column; gap:8px}
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch}
.muted{color:var(--ink-3)}
.tiny{font-size:11.5px; line-height:1.45}
.footer{padding:22px 16px 8px; text-align:center; font-size:12px; color:var(--ink-3); line-height:1.6}
.sronly{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
</style>

<div class="wrap">

<header class="top">
  <div class="brandrow">
    <div class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M2 15.5 L7 6 L10.2 11.4 L12.4 8 L18 15.5 Z" fill="#E8834E"/>
        <circle cx="14.6" cy="4.4" r="2.1" fill="#F1EFE9"/>
      </svg>
    </div>
    <div class="brand">
      <h1>Yosemite Standard Time</h1>
      <div class="sub">Nine of us · Sept 2026</div>
    </div>
    <div class="clockbox">
      <div class="t mono" id="clockTime">--:--</div>
      <div class="d" id="clockDay">loading</div>
    </div>
  </div>
  <nav class="rail" role="tablist" id="rail"></nav>
</header>

<main id="panels">
  <section role="tabpanel" id="p-now"    aria-label="Now"></section>
  <section role="tabpanel" id="p-plan"   aria-label="Plan" hidden></section>
  <section role="tabpanel" id="p-drive"  aria-label="Drive" hidden></section>
  <section role="tabpanel" id="p-map"    aria-label="Map" hidden></section>
  <section role="tabpanel" id="p-do"     aria-label="Do" hidden></section>
  <section role="tabpanel" id="p-crew"   aria-label="Crew" hidden></section>
  <section role="tabpanel" id="p-offline" aria-label="No signal" hidden></section>
  <section role="tabpanel" id="p-log"    aria-label="Log" hidden></section>
</main>

<div class="footer">
  Built for the nine of us · Sept 4&ndash;8, 2026<br>
  Times are estimates, not promises. Check the road before you trust the clock.
</div>
</div>

<script>
"use strict";

/* =====================================================================
   DATA — everything the app knows, baked in so it works with no signal.
   Times are Pacific. Drive minutes are realistic (not Google-optimistic).
   ===================================================================== */

const TZ_LABEL = "PT";

const CREW = [
  { id:"shreyas",  name:"Shreyas",   short:"SD", color:"#B94E1C" },
  { id:"shivam",   name:"Shivam",    short:"SH", color:"#2A657F" },
  { id:"simran",   name:"Simran",    short:"SI", color:"#7A4E8C" },
  { id:"kshitiz",  name:"Kshitiz",   short:"KS", color:"#3B7549" },
  { id:"ashir",    name:"Ashir",     short:"AS", color:"#9E7015" },
  { id:"dipto",    name:"Dipto",     short:"DI", color:"#A63929" },
  { id:"nachiket", name:"Nachiket",  short:"NA", color:"#1F6F6B" },
  { id:"sadrishya",name:"Sadrishya", short:"SA", color:"#8C4A6B" },
  { id:"jovina",   name:"Jovina",    short:"JO", color:"#4A5C8C" },
];
const byId = id => CREW.find(c => c.id === id);

const PLACES = {

/* =====================================================================

   ===================================================================== */
const TRIP_DATES = ["2026-09-04","2026-09-05","2026-09-06","2026-09-07","2026-09-08"];

function hm(s){ const [h,m] = String(s).split(":").map(Number); return h*60 + (m||0); }
function fmt(min){
  min = ((Math.round(min) % 1440) + 1440) % 1440;
  const h24 = Math.floor(min/60), m = min%60;
  const h = h24 % 12 === 0 ? 12 : h24 % 12;
  return h + ":" + String(m).padStart(2,"0") + (h24 < 12 ? "a" : "p");
}
function dur(min){
  min = Math.round(min);
  const h = Math.floor(min/60), m = min%60;
  if (h && m) return h + "h " + m + "m";
  if (h) return h + "h";
  return m + "m";
}
/* Current wall time in Pacific, regardless of the device's own zone. */
function paNow(){
  const d = new Date();
  const p = new Intl.DateTimeFormat("en-CA", {
    timeZone:"America/Los_Angeles", year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", weekday:"short", hour12:false,
  }).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
  let hh = parseInt(p.hour,10); if (hh === 24) hh = 0;
  return {
    date: p.year + "-" + p.month + "-" + p.day,
    min: hh*60 + parseInt(p.minute,10),
    wd: p.weekday,
  };
}
function dayIndexFor(dateStr){ return TRIP_DATES.indexOf(dateStr); }

/* =====================================================================
   THE TIME-BUDGET ENGINE
   Walks a variant's steps from the day's start and stamps every step
   with the clock time you actually arrive.
   ===================================================================== */
function runChain(day, variantKey){
  const v = day.variants[variantKey] || day.variants[Object.keys(day.variants)[0]];
  const B = base();
  let t = hm(day.startBase ? B[day.startBase] : day.start);
  const startMin0 = t;
  const out = [];
  for (const st of v.steps){
    const min = st.baseLeg ? B.legs[st.baseLeg] : st.min;
    const to  = st.to === "airbnb" ? B.place : st.to;
    const start = t;
    t += min;
    out.push(Object.assign({}, st, { min, to, start, end:t }));
  }
  const sun = SUN[day.date];
  return {
    variant:v, key:variantKey, rows:out,
    startMin: startMin0, endMin: t,
    driveMin: out.filter(s=>s.k==="drive").reduce((a,s)=>a+s.min,0),
    stopMin:  out.filter(s=>s.k==="stop").reduce((a,s)=>a+s.min,0),
    sunset: sun ? hm(sun.set) : null,
    sunrise: sun ? hm(sun.rise) : null,
  };
}
function verdictFor(day, res){
  const end = res.endMin, elapsed = res.endMin - res.startMin;
  const tone = end >= 24*60 ? "bad"
             : (end >= 23*60 || elapsed >= 16*60) ? "warn"
             : end >= 22*60 ? "warn" : "ok";
  let txt;
  if (end >= 24*60)          txt = "Gets you in after midnight";
  else if (elapsed >= 17*60) txt = dur(elapsed) + " door to door — brutal";
  else if (end >= 23*60)     txt = "Late — bed around midnight";
  else if (elapsed >= 15*60) txt = dur(elapsed) + " door to door";
  else if (end >= 22*60)     txt = "Long, but survivable";
  else                       txt = "Home at a human hour";
  return { tone, txt };
}

function persist(kind){
  LS.set(kind, state[kind]);
  if (!DB || !DOCS[kind]) return;
  DB.doc(DOCS[kind]).set({ v: state[kind] }).catch(()=>{ /* offline or denied: local copy stands */ });
}

async function initDb(){
  try { DB = await window.claude?.use?.("db") ?? null; } catch(e){ DB = null; }
  if (!DB){ setSync("local"); return; }
  setSync("live");
  for (const [kind, path] of Object.entries(DOCS)){
    try {
      DB.doc(path).onSnapshot(snap => {
        if (!snap.exists) return;
        const v = snap.data()?.v;
        if (v === undefined) return;
        state[kind] = v; LS.set(kind, v); render();
      }, () => setSync("local"));
    } catch(e){ /* bad path can't happen here, but never take the page down */ }
  }
  for (const coll of ["log","checkins"]){
    try {
      DB.collection(coll).orderBy("ts","desc").limit(200).onSnapshot(snap => {
        state[coll] = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
        LS.set(coll, state[coll]); render();
      }, () => setSync("local"));
    } catch(e){}
  }
}
function addToCollection(coll, body){
  const rec = Object.assign({ id: "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,6) }, body);
  state[coll] = [rec].concat(state[coll]).slice(0,200);
  LS.set(coll, state[coll]);
  render();
  if (DB){ DB.collection(coll).doc(rec.id).set(body).catch(()=>{}); }
}

/* =====================================================================

   ===================================================================== */
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  if (kids) for (const k of [].concat(kids)){
    if (k === null || k === undefined || k === false) continue;
    n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return n;
}

/* =====================================================================
   THE DAY RIBBON — 4am to midnight, drives thin, stops tall, now-needle
   ===================================================================== */
const RIB_A = 240, RIB_B = 1440, RIB_SPAN = RIB_B - RIB_A;
const ribX = m => Math.max(0, Math.min(1000, (m - RIB_A) / RIB_SPAN * 1000));

function ribbon(day, res, nowMin){
  const sun = SUN[day.date] || {};
  const rise = sun.rise ? hm(sun.rise) : null;
  const set  = sun.set  ? hm(sun.set)  : null;
  const parts = [];
  parts.push('<rect x="0" y="0" width="1000" height="64" fill="var(--sunk)"/>');
  if (rise !== null && set !== null){
    parts.push('<rect x="' + ribX(rise).toFixed(1) + '" y="0" width="' +
      (ribX(set) - ribX(rise)).toFixed(1) + '" height="64" fill="var(--surface-2)"/>');
  }
  if (res){
    for (const r of res.rows){
      const x = ribX(r.start), w = Math.max(1.5, ribX(Math.min(r.end, RIB_B)) - x);
      if (r.k === "drive"){
        parts.push('<rect x="' + x.toFixed(1) + '" y="27" width="' + w.toFixed(1) +
          '" height="10" rx="3" fill="var(--ink-3)" opacity="0.55"/>');
      } else {
        parts.push('<rect x="' + x.toFixed(1) + '" y="13" width="' + w.toFixed(1) +
          '" height="38" rx="4" fill="var(--accent)"/>');
      }
    }
  }
  if (rise !== null) parts.push('<rect x="' + (ribX(rise)-0.8).toFixed(1) + '" y="0" width="1.6" height="64" fill="var(--warn)"/>');
  if (set  !== null) parts.push('<rect x="' + (ribX(set)-0.8).toFixed(1)  + '" y="0" width="1.6" height="64" fill="var(--warn)"/>');
  if (nowMin !== null && nowMin >= RIB_A && nowMin <= RIB_B){
    parts.push('<rect x="' + (ribX(nowMin)-1.2).toFixed(1) + '" y="0" width="2.4" height="64" fill="var(--ink)"/>');
  }
  const svg = '<svg viewBox="0 0 1000 64" preserveAspectRatio="none" aria-hidden="true">' + parts.join("") + '</svg>';
  return el("div", { class:"ribbon-wrap" }, [
    el("div", { class:"ribbon", html:svg }),
    el("div", { class:"hours", style:"margin-top:5px" }, ["4a","8a","12p","4p","8p","12a"].map(h => el("span",{text:h}))),
    el("div", { class:"ribbon-legend" }, [
      el("span",{class:"lg"},[el("i",{style:"background:var(--accent)"}),"Stops"]),
      el("span",{class:"lg"},[el("i",{style:"background:var(--ink-3);opacity:.55"}),"Driving"]),
      el("span",{class:"lg"},[el("i",{style:"background:var(--warn)"}),"Sunrise / sunset"]),
    ]),
  ]);
}

function paintSync(node){
  node.className = "sync " + syncMode;
  node.replaceChildren(
    el("span",{class:"dot"}),
    el("span",{ html: syncMode === "live"
      ? "<strong>Shared.</strong> Everyone with the link sees your edits."
      : "<strong>This phone only.</strong> Your edits are saved here but not shared — use Copy plan to paste into the group chat." })

function currentDay(now){
  const i = dayIndexFor(now.date);
  return i >= 0 ? DAYS[i] : null;
}

function renderNow(){
  const p = document.getElementById("p-now");
  const now = paNow();
  const day = currentDay(now);
  const kids = [];

  const sb = el("div", { id:"syncBanner" }); paintSync(sb); kids.push(sb);

  if (!state.me) kids.push(whoAreYouCard());

  if (!day){
    const first = new Date("2026-09-04T09:37:00-07:00").getTime();
    const days = Math.max(0, Math.ceil((first - Date.now()) / 86400000));
    kids.push(card([
      el("div",{class:"hero-top"},[
        el("div",{class:"hero-label"},[ pill("accent","Not there yet") ]),
        el("div",{class:"what",text: days > 0 ? days + (days===1?" day to go":" days to go") : "Trip's done"}),
        el("div",{class:"where",text: days > 0
          ? "Friday 4 September — Dipto lands at SFO at 9:37a and it starts."
          : "Everything below is still here. Head to the Log tab."}),
      ]),
      el("div",{class:"sunstrip"},[
        sunCell("First alarm","5:00a"), sunCell("Longest day","Sat · 400 mi"), sunCell("Total","~1,000 mi"),
      ]),
    ]));
    kids.push(readyCard());
    paint(p, kids);
    return;
  }

  /* what is happening right now */
  let hero, count = null;
  if (day.kind === "chain"){
    const res = runChain(day, state.plan[day.id]);
    let cur = null, next = null;
    for (const r of res.rows){
      if (now.min >= r.start && now.min < r.end){ cur = r; }
      if (r.start > now.min && !next){ next = r; }
    }
    if (now.min < res.startMin){
      const mins = res.startMin - now.min;
      hero = heroCard("Not moving yet", "Leaving at " + fmt(res.startMin), day.name, mins < 90);
      count = countdownRow(mins, "until you leave — " + (res.rows[0] ? PLACES[res.rows[0].to]?.name || "first leg" : ""));
    } else if (cur){
      const rest = cur.end - now.min;
      const label = cur.k === "drive"
        ? "Driving to " + (PLACES[cur.to]?.name || "next stop")
        : cur.title;
      hero = heroCard(cur.k === "drive" ? "On the road" : "Right now", label,
        cur.note || "", false);
      count = countdownRow(rest, cur.k === "drive"
        ? "left on this leg · arrive " + fmt(cur.end)
        : "left here if you're keeping to plan");
    } else if (next){
      hero = heroCard("Next up", next.k === "drive"
        ? "Drive to " + (PLACES[next.to]?.name || "next stop") : next.title, next.note || "", true);
      count = countdownRow(next.start - now.min, "until " + fmt(next.start));
    } else {
      hero = heroCard("Day's done", "Get some sleep", 
        day.id === "sat" ? "Tomorrow starts at 4:15a. That is not a joke." : "", false);
    }
    kids.push(hero);
    if (count) kids.push(count);
    kids.push(sunCard(day));
    kids.push(card([ head("Today at a glance", day.variants[state.plan[day.id]]?.name || ""), ribbon(day, res, now.min) ]));
    kids.push(verdictCard(day, res));
  } else {
    const upcoming = day.board.filter(b => b.t !== "—" && hm(b.t) > now.min);
    const nxt = upcoming[0];
    hero = nxt
      ? heroCard("Next up", nxt.title, nxt.note || "", (hm(nxt.t) - now.min) < 60)
      : heroCard("Nothing scheduled", day.name, "Board's clear for the rest of today.", false);
    kids.push(hero);
    if (nxt) kids.push(countdownRow(hm(nxt.t) - now.min, "until " + fmt(hm(nxt.t))));
    kids.push(sunCard(day));
    kids.push(card([ head(day.label + " — the board"), boardRows(day, now) ]));
  }

  kids.push(quickJump());
  paint(p, kids);
}

  const day = DAYS.find(d => d.id === state.viewDay) || DAYS[0];

  if (day.kind === "board"){
    kids.push(card([

      head("Three arrivals, three cars"),

        " — that is a full car on its own, so whoever fetches them should arrive empty.",
      ]),
    ]));
    kids.push(planNotes(day));
    paint(p, kids);
    return;
  }

  /* variant picker */
  const vkeys = Object.keys(day.variants);
  if (vkeys.length > 1){
    kids.push(card([
      head("Which version of " + day.label + "?"),
      el("div",{class:"card-pad",style:"padding-top:8px;display:flex;flex-direction:column;gap:8px"},
        vkeys.map(k => {

            class:"btn wide", style:"flex-direction:column;align-items:stretch;gap:5px;padding:11px;text-align:left;" +

          },[
            el("span",{style:"display:flex;align-items:center;gap:7px;flex-wrap:wrap"},[
              el("span",{style:"font-size:13.5px;font-weight:700",text:v.name}),
              v.tag ? pill(k === "c" || v.tag === "Recommended" ? "ok" : "plain", v.tag) : null,
            ]),
            el("span",{class:"mono vsum",style:"font-size:11px;color:var(--ink-2);font-weight:400;line-height:1.4"},
              [ "back " + fmt(r.endMin) + " · " + dur(r.driveMin) + " driving · " + vd.txt ]),
          ]);
        })),
    ]));
  }

  const res = runChain(day, state.plan[day.id]);
  kids.push(card([
    head(day.name, day.drive),
    el("div",{class:"card-pad hint sm",style:"padding-top:7px",text:res.variant.blurb || ""}),
    ribbon(day, res, dayIndexFor(now.date) === DAYS.indexOf(day) ? now.min : null),
  ]));
  kids.push(verdictCard(day, res));

  kids.push(card([
    head("Hour by hour", "from " + fmt(res.startMin)),
    el("div",{class:"tl"}, res.rows.map(r => {
      const isNow = dayIndexFor(now.date) === DAYS.indexOf(day) && now.min >= r.start && now.min < r.end;
      const place = PLACES[r.k === "drive" ? r.to : r.at];
      return el("div",{class:"tl-row " + r.k + (isNow ? " now" : "")},[
        el("div",{class:"tl-time mono"},[ fmt(r.start), el("small",{text:dur(r.min)}) ]),
        el("div",{class:"tl-body"},[
          el("div",{class:"tl-title"},[
            r.k === "drive" ? ("drive → " + (place?.name || "next")) : r.title,
          ]),
          r.note ? el("div",{class:"tl-note",text:r.note}) : null,
          (r.k === "drive" || r.at) ? el("div",{class:"tl-links"},[
            mapsBtn(r.k === "drive" ? r.to : r.at, r.k === "drive" ? "Navigate" : "Open in Maps"),
          ]) : null,
        ]),
      ]);
    })),
  ]));
  kids.push(planNotes(day));
  paint(p, kids);
}

function crowdCards(){
  const now = paNow();
  const inTrip = dayIndexFor(now.date) >= 0;
  const hourIdx = Math.floor(now.min/60) - CROWD_H0;
  const out = [];

  out.push(card([
    head("Rush levels", inTrip ? "now " + fmt(now.min) : "typical holiday weekend"),
    el("div",{class:"card-pad hint sm",style:"padding-top:7px",
      text:"Modelled from reported Labor Day patterns — not a live feed. Treat it as a good guess about when to move, not a measurement."}),
    el("div",{class:"crowd"}, CROWDS.map(c => {
      const cur = (hourIdx >= 0 && hourIdx < c.lv.length) ? c.lv[hourIdx] : null;
      const tone = cur === null ? "plain" : cur >= 4 ? "bad" : cur === 3 ? "bad" : cur === 2 ? "warn" : "ok";
      const word = cur === null ? "closed hours" : cur >= 4 ? "Turned away" : cur === 3 ? "Packed" : cur === 2 ? "Busy" : "Clear";
      return el("div",{class:"crowd-row"},[
        el("div",{class:"crowd-top"},[
          el("span",{class:"nm",text:c.nm}),
          inTrip && cur !== null ? pill(tone, word) : null,
          mapsBtn(c.key,"Map"),
        ]),
        el("div",{class:"bars"}, c.lv.map((v,i) =>
          el("i",{class:"l"+v + (inTrip && i === hourIdx ? " nowbar" : "")}))),
        el("div",{class:"hours"},[el("span",{text:"5a"}),el("span",{text:"9a"}),el("span",{text:"1p"}),el("span",{text:"5p"}),el("span",{text:"9p"})]),
        el("div",{class:"hint sm",text:c.tip}),
      ]);
    })),
  ]));

  out.push(card([
    head("What this means for you"),
    el("div",{class:"card-pad",style:"padding-top:9px;display:flex;flex-direction:column;gap:8px"},[
      flag("ok","Your Sunday plan is already the right answer.","Tunnel View at 6:15a and parked by 7:20a puts you ahead of everything on this page. The 4:15a alarm is the whole reason it works."),
      flag("warn","Your Saturday gate is the easy one.","Tioga Pass is the calmest entrance in the park and you hit it around 13:35 — a non-event. The South Entrance on Sunday morning is the one to beat, and you beat it by hours."),
      flag("cool","Glacier Point at sunset means roadside parking.","Arriving 18:30 on a Saturday, the lot will be full. Expect to park along the road and walk 5–10 minutes. Budget it."),
    ]),
  ]));
  return out;
}

function moveCar(who){
  const keys = Object.keys(state.cars);
  const cur = keys.findIndex(k => state.cars[k].who.indexOf(who) >= 0);
  const next = keys[(cur + 1) % keys.length];
  const cars = {};
  for (const k of keys) cars[k] = { nm:state.cars[k].nm, who:state.cars[k].who.filter(x => x !== who) };
  cars[next].who = cars[next].who.concat([who]);
  state.cars = cars; persist("cars"); render();
}
function togglePack(id){
  const rec = state.packing[id] || {};
  const now = rec.done ? {} : { done:true, by:state.me || null };
  state.packing = Object.assign({}, state.packing, { [id]: now });
  persist("packing"); render();

function checkIn(where){ addToCollection("checkins", { who:state.me, where, ts:Date.now() }); }
function relTime(ts){
  const m = Math.round((Date.now() - ts)/60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m/60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  return Math.round(h/24) + " days ago";
}

function offlineRows(){
  const out = [];
  for (const spec of OFF_SPEC){
    const day = DAYS.find(x => x.id === spec.d);
    if (!day) continue;
    let when = null;
    if (spec.fixed) when = hm(spec.fixed);
    else {
      const res = runChain(day, state.plan[day.id]);
      if (spec.at === "start")    when = res.startMin;
      else if (spec.at === "end") when = res.endMin;
      else {
        const hit = res.rows.find(r => r.title && spec.m.test(r.title));
        if (!hit) continue;
        when = hit.start;
      }
    }
    out.push([day.label + " " + fmt(when), spec.fn ? spec.fn() : spec.txt]);
  }
  return out;
}

function planText(){
  const L = ["YOSEMITE STANDARD TIME — Sept 4–8 2026", ""];
  for (const day of DAYS){
    L.push(day.label.toUpperCase() + " " + day.date.slice(5) + " — " + day.name);
    if (day.kind === "board"){
      for (const b of day.board) L.push("  " + (b.t === "—" ? "open " : fmt(hm(b.t)).padEnd(6)) + " " + b.title);
    } else {
      const res = runChain(day, state.plan[day.id]);
      L.push("  [" + res.variant.name + "]");
      for (const r of res.rows){
        L.push("  " + fmt(r.start).padEnd(6) + " " +
          (r.k === "drive" ? "drive → " + (PLACES[r.to]?.name || "") + " (" + dur(r.min) + ")" : r.title));
      }
      L.push("  back at " + fmt(res.endMin) + " · " + dur(res.driveMin) + " driving");
    }
    L.push("");
  }
  L.push("Last fuel before Yosemite: Tioga Gas Mart, Lee Vining (6:30a–9p).");
  L.push("No gas in Yosemite Valley. Crane Flat and Wawona only.");
  L.push("Text YNPTraffic to 333111 for live park traffic alerts.");
  return L.join("\n");
}
async function copyPlan(){
  const txt = planText();

    try { document.execCommand("copy"); toast("Plan copied."); }

async function saveRecap(){
  const L = ["# Yosemite Standard Time", "", "Yosemite, Labor Day weekend 2026. Nine of us, three cars, about a thousand miles.", ""];
  L.push("## The plan we actually ran", "", "```", planText(), "```", "");

  if (entries.length){
    L.push("## The log", "");
    for (const e of entries) L.push("**" + (byId(e.who)?.name || "Someone") + "** · " + stamp(e.ts) + "  \n" + e.text + "\n");

  }).filter(r => r.n).sort((a,b)=>b.avg-a.avg);

async function offer(filename, data, okMsg){
  if (!DOWNLOADS){ toast("Saving isn't available in this view. Try opening the artifact in a browser tab."); return; }
  try { await DOWNLOADS.save({ filename, data }); toast(okMsg); }
  catch(e){
    const c = e && e.code;
    if (c === "declined") return;
    if (c === "rate_limited") toast("One save at a time — try again in a moment.");
    else if (c === "too_large") toast("That file is too big to save.");
    else toast("Couldn't save the file here.");
  }
}

    t = el("div",{ id:"toast", style:"position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:99;" +

  rendering = true;
  try {
    const ta = document.getElementById("logText");
    const draft = ta ? ta.value : null;
    const tb = TABS.find(t => t.k === state.tab) || TABS[0];
    try { tb.fn(); } catch(e){ console.error(tb.k, e); }
    if (draft){ const ta2 = document.getElementById("logText"); if (ta2) ta2.value = draft; }
    paintTabs();
    tickClock();
  } finally { rendering = false; }
}
function tickClock(){
  const now = paNow();
  const ct = document.getElementById("clockTime");
  const cd = document.getElementById("clockDay");
  if (ct) ct.textContent = fmt(now.min);
  if (cd){
    const i = dayIndexFor(now.date);
    cd.textContent = i >= 0 ? now.wd + " · day " + (i+1) + " of 5" : now.wd + " · " + TZ_LABEL;
  }
}

(function boot(){
  const nowD = paNow();
  const i = dayIndexFor(nowD.date);
  state.viewDay = LS.get("viewDay", null) || (i >= 0 ? DAYS[i].id : "sat");
  state.tab = LS.get("tab", "now");
  if (!TABS.some(t => t.k === state.tab)) state.tab = "now";
  buildRail();
  render();
  setInterval(tickClock, 20000);
  let lastMin = nowD.min;
  setInterval(() => {
    const n = paNow();
    if (n.min !== lastMin){ lastMin = n.min; if (state.tab === "now" || state.tab === "plan") render(); }
  }, 30000);

  initDb();
  (async () => {
    try { DOWNLOADS = await window.claude?.use?.("downloads") ?? null; } catch(e){ DOWNLOADS = null; }
    render();
  })();
})();

</script>
